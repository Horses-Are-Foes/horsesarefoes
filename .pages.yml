media:
  - name: images
    label: Report images
    input: assets
    output: /assets
    rename: safe
    extensions: [jpg, jpeg, png, gif, webp]

content:
  - name: reports
    label: Reports
    type: collection
    path: reports
    filename:
      template: "{fields.slug}/index.md"
      field: false
    format: yaml-frontmatter
    subfolders: true
    exclude:
      - "**/*.html"
      - "**/*.jpg"
      - "**/*.png"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL name
        hint: Lowercase letters, numbers, and hyphens only. Example: horse-control-report
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: description
        label: Summary
        type: text
      - name: author
        label: Author
        type: string
        required: true
      - name: cover
        label: Cover image
        hint: Choose or upload a cover image. Friends do not need to type a file name.
        type: image
        options:
          media: images
      - name: image_width
        label: Inserted image width
        hint: Sets the default size for images added in the report.
        type: select
        options:
          values:
            - { name: small, label: Small - 25 percent }
            - { name: medium, label: Medium - 50 percent }
            - { name: large, label: Large - 75 percent }
            - { name: full, label: Full width }
      - name: image_position
        label: Inserted image position
        hint: Sets the default position for images added in the report.
        type: select
        options:
          values:
            - { name: left, label: Left }
            - { name: center, label: Center }
            - { name: right, label: Right }
      - name: report_images
        label: Report images
        hint: Add one row per image, then choose its size and position.
        type: block
        list: true
        blockKey: type
        blocks:
          - name: image
            fields:
              - name: image
                label: Image
                type: image
                options:
                  media: images
              - name: width
                label: Size
                type: select
                options:
                  values:
                    - { name: small, label: Small - 25 percent }
                    - { name: medium, label: Medium - 50 percent }
                    - { name: large, label: Large - 75 percent }
                    - { name: full, label: Full width }
              - name: position
                label: Position
                type: select
                options:
                  values:
                    - { name: left, label: Left }
                    - { name: center, label: Center }
                    - { name: right, label: Right }
              - name: caption
                label: Caption
                type: string
      - name: body
        label: Report
        hint: Use the visual editor to format text and insert images.
        type: rich-text
        options:
          format: html
          media: images
          path: reports
          rename: safe
          switcher: true

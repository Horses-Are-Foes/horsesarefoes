media:
  - name: images
    label: Report images
    input: assets
    output: /assets
    rename: safe
    extensions: [jpg, jpeg, png, gif, webp]

content:
  - name: reports
    label: Reports
    type: collection
    path: reports
    filename:
      template: "{fields.slug}/index.md"
      field: false
    format: yaml-frontmatter
    subfolders: true
    exclude:
      - "**/*.html"
      - "**/*.jpg"
      - "**/*.png"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL name
        hint: Lowercase letters, numbers, and hyphens only. Example: horse-control-report
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: description
        label: Summary
        type: text
      - name: author
        label: Author
        type: string
        required: true
      - name: cover
        label: Cover image
        hint: Choose or upload a cover image. Friends do not need to type a file name.
        type: image
        options:
          media: images
      - name: sections
        label: Report Content
        hint: Add text and image blocks in the order they should appear in the report.
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - name: content
                label: Text
                type: rich-text
                hint: Images insert as Markdown. Add {width=50% align=center} after an image token to set sizing and position; supported alignments are left, center, and right.
                options:
                  format: html
                  media: images
                  switcher: true
          - name: image
            label: Image
            fields:
              - name: image
                label: Image
                required: true
                type: image
                options:
                  media: images
              - name: width
                label: Size
                required: true
                type: select
                options:
                  values:
                    - { name: small, label: Small - 25 percent }
                    - { name: medium, label: Medium - 50 percent }
                    - { name: large, label: Large - 75 percent }
                    - { name: full, label: Full width }
              - name: position
                label: Position
                required: true
                type: select
                options:
                  values:
                    - { name: left, label: Left }
                    - { name: center, label: Center }
                    - { name: right, label: Right }
              - name: caption
                label: Caption
                type: string

media:
  - name: images
    label: Report images
    input: assets
    output: /assets
    rename: safe
    extensions: [jpg, jpeg, png, gif, webp]

content:
  - name: reports
    label: Reports
    type: collection
    path: reports
    filename:
      template: "{fields.slug}/index.md"
      field: false
    format: yaml-frontmatter
    subfolders: true
    exclude:
      - "**/*.html"
      - "**/*.jpg"
      - "**/*.png"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL name
        hint: Lowercase letters, numbers, and hyphens only. Example: horse-control-report
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: description
        label: Summary
        type: text
      - name: author
        label: Author
        type: string
        required: true
      - name: cover
        label: Cover image
        hint: Choose or upload a cover image. Friends do not need to type a file name.
        type: image
        options:
          media: images
      - name: body
        label: Report
        hint: Use the visual editor to format text and insert images.
        type: rich-text
        options:
          format: markdown
          media: images
          path: reports
          rename: safe
          switcher: true
